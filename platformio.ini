; PlatformIO Project Configuration File
;
; One environment per node type. They share the [env] base (board, framework,
; serial speed, common build flags) and select their game logic / pin map via a
; -D NODE_TYPE_IS_* build flag that config.h reads.
;
; Build a specific node:   pio run -e controlpoint
; Upload via USB:          pio run -e controlpoint -t upload
; Upload via OTA (later):  pio run -e controlpoint -t upload --upload-port <node>.local
; Serial monitor:          pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    adafruit/Adafruit GFX Library@^1.11.0
; WiFi.h and Preferences.h ship with the ESP32 Arduino core — no lib_deps yet.
; MQTT/LED/display libraries get added here as those modules land.
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:controlpoint]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_CONTROLPOINT

[env:flag]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_FLAG

[env:referee]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_REFEREE

; Default convenience environment so a bare `pio run` still builds a control
; point (config.h also defaults to control point if no flag is set).
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_CONTROLPOINT
