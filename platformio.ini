; PlatformIO Project Configuration File
;
; One environment per node type. They share the [env] base (board, framework,
; serial speed, common build flags) and select their game logic / pin map via a
; -D NODE_TYPE_IS_* build flag that config.h reads.
;
; Build a specific node:   pio run -e controlpoint
; Upload via USB:          pio run -e controlpoint -t upload
; Upload via OTA (later):  pio run -e controlpoint -t upload --upload-port <node>.local
; Serial monitor:          pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit SSD1306@^2.5
; WiFi.h and Preferences.h ship with the ESP32 Arduino core. Adafruit GFX is
; shared by the OLED now and the ST7789 LCD later. LED libs land with that
; module.
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:controlpoint]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_CONTROLPOINT

[env:flag]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_FLAG

[env:referee]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_REFEREE

; Default convenience environment so a bare `pio run` still builds a control
; point (config.h also defaults to control point if no flag is set).
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -D NODE_TYPE_IS_CONTROLPOINT

; OTA upload environment. Builds the same control-point firmware as esp32dev
; but pushes it over WiFi via ArduinoOTA instead of USB. Pass the node's IP or
; mDNS name at upload time:
;   pio run -e esp32dev_ota -t upload --upload-port 192.168.88.46
;   pio run -e esp32dev_ota -t upload --upload-port airsoft-controlpoint-alpha.local
; If an OTA password is set in secrets.h, add: --upload-flags --auth=<password>
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
